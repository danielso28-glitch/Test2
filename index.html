<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Two Paths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Paths">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=8e00c29">
<link rel="stylesheet" href="css/intro.css?v=8e00c29">
<link rel="stylesheet" href="css/map.css?v=8e00c29">
<link rel="stylesheet" href="css/booking.css?v=8e00c29">
<link rel="stylesheet" href="css/scan.css?v=8e00c29">
<link rel="stylesheet" href="css/tracker.css?v=8e00c29">
<link rel="stylesheet" href="css/confirmation.css?v=8e00c29">
<link rel="stylesheet" href="css/main-app.css?v=8e00c29">
<link rel="stylesheet" href="css/avatar.css?v=8e00c29">
<link rel="stylesheet" href="css/feed.css?v=8e00c29">
<link rel="stylesheet" href="css/settings.css?v=8e00c29">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="badge" data-t="proto">PROTOTYPE</div>

  <!-- 1 -->
  <section class="screen s1" id="s1">
    <div class="pad" style="display:flex;flex-direction:column;gap:24px;flex:1;padding-bottom:28px">
      <header>
        <div class="logo"><svg viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 2l9 11 9-11M11 13v11"/></svg>Two Paths</div>
        <div class="head-btns">
          <button class="pillbtn" id="aplus" aria-label="Text size">A+</button>
          <button class="pillbtn" data-open-settings aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></button>
        </div>
      </header>
      <div class="bars" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></div>
      <h1 data-t="s1title"></h1>
      <button class="scan" id="scanBtn">
        <span class="face"><svg viewBox="0 0 36 36" fill="none" stroke="#12201B" stroke-width="2.6" stroke-linecap="round"><path d="M3 11V6a3 3 0 0 1 3-3h5M25 3h5a3 3 0 0 1 3 3v5M33 25v5a3 3 0 0 1-3 3h-5M11 33H6a3 3 0 0 1-3-3v-5"/><circle cx="13.5" cy="15" r="1.4" fill="#12201B"/><circle cx="22.5" cy="15" r="1.4" fill="#12201B"/><path d="M12.5 22c3 2.5 8 2.5 11 0"/></svg></span>
        <span><b data-t="scanT"></b><span data-t="scanD"></span></span>
      </button>
      <p class="q"><span data-t="matters"></span><small data-t="mattersSub"></small></p>
      <div class="grid" id="goals"></div>
      <button class="cta" id="showPaths"><span data-t="show"></span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      <div style="text-align:center"><button class="link" id="noPhoto" data-t="nophoto"></button></div>
    </div>
  </section>

  <!-- 2 Path A -->
  <section class="screen story s2" id="s2" hidden style="background:var(--sky-a)">
    <div class="top pad">
      <div class="bars"><i><b id="progA"></b></i><i><b></b></i></div>
      <div class="row">
        <button class="round" data-go="s1" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <div class="chip"><span class="av" data-avatar="sad"></span><span style="min-width:0"><b data-t="pathA"></b><span data-scanlabel></span></span></div>
        <button class="round" data-share aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg></button>
      </div>
    </div>
    <div class="scene" id="sceneA"></div>
    <div class="dlg pad">
      <div class="who" id="whoA"></div>
      <p class="line sub" id="subA"></p>
      <div class="player"><button class="play" data-play="A" aria-label="Play"></button><div class="track"><b id="trA"></b></div><span class="time" id="tmA"></span></div>
      <button class="cta light" data-go="s3"><span data-t="seeB"></span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    </div>
  </section>

  <!-- 3 Path B -->
  <section class="screen story s3" id="s3" hidden style="background:var(--peach)">
    <div class="top pad">
      <div class="bars"><i><b style="width:100%"></b></i><i><b id="progB"></b></i></div>
      <div class="row">
        <button class="round" data-go="s2" aria-label="Back" style="background:rgba(70,62,50,.7)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <div class="chip" style="background:rgba(70,62,50,.7)"><span class="av" data-avatar="happy"></span><span style="min-width:0"><b data-t="pathB"></b><span data-scanlabel></span></span></div>
        <button class="round" data-share aria-label="Share" style="background:rgba(70,62,50,.7)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg></button>
      </div>
    </div>
    <div class="scene" id="sceneB"></div>
    <div class="dlg pad">
      <div class="who" id="whoB"></div>
      <p class="line sub" id="subB"></p>
      <div class="player"><button class="play" data-play="B" aria-label="Play"></button><div class="track"><b id="trB"></b></div><span class="time" id="tmB"></span></div>
      <button class="cta lime" id="chooseB"><span data-t="chooseB"></span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      <div class="again"><button class="link" data-go="s2" data-t="watchA"></button></div>
    </div>
  </section>

  <!-- 4 Groups (intro) -->
  <section class="screen s4" id="s4" hidden>
    <div class="mapwrap" id="mapA"></div>
    <div class="sheet pad">
      <div class="grab"></div>
      <div class="bars" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <h1 style="font-size:2.3rem" data-count></h1>
      <p class="locmsg" data-locmsg></p>
      <div class="chips" data-chips></div>
      <div class="list" data-list></div>
    </div>
  </section>

  <!-- 5 Detail -->
  <section class="screen s5 pad" id="s5" hidden>
    <div class="topbar"><button class="round" id="detailBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button></div>
    <div><h2 class="t" id="dName"></h2><p class="sub" id="dWhen"></p></div>
    <div class="facts">
      <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><div><b id="dPlace"></b><span id="dDist"></span></div></div>
      <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><div><b id="dLed"></b><span id="dTrainer"></span></div></div>
      <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.8"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5M15 14.5c3 0 5.5 2 6.5 5.5"/></svg><div><b data-t="age"></b><span id="dSpots"></span></div></div>
      <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><div><b data-t="bring"></b><span data-t="bringD"></span></div></div>
    </div>
    <div class="ptsbox card" id="dPts"></div>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-t="trial"></span></div>
    <form class="ins card" id="insForm" novalidate>
      <h3 data-t="letpay"></h3>
      <label class="l" for="insNo" data-t="insNo"></label>
      <input type="text" id="insNo" value="A123456789" maxlength="10" autocomplete="off" spellcheck="false">
      <p class="hint" data-t="insHint"></p>
      <p class="err" id="insErr" hidden></p>
      <label class="check"><input type="checkbox" id="consent" checked><span data-t="consent"></span></label>
      <p class="demo" data-t="demoNote"></p>
    </form>
    <p class="note" id="alreadyIn" hidden></p>
    <button class="cta" id="join" type="button"><span data-t="join"></span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
  </section>

  <!-- 6 Confirmation -->
  <section class="screen s6" id="s6" hidden>
    <div class="hero6 pad">
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 data-t="youreIn"></h1>
      <p id="startsOn"></p>
    </div>
    <div class="body6 pad">
      <div class="card">
        <div class="when"><div class="date"><small id="cDay"></small><strong id="cNum"></strong><em id="cMon"></em></div><div style="min-width:0"><b id="cName"></b><span id="cTime"></span><span id="cEvery"></span></div></div>
        <div class="ppl"><div class="avs"><i style="background:#D3E9D9;color:#2E6B4C">MK</i><i style="background:#FFE3CC;color:#A4501E">EB</i><i style="background:#DFEAF6;color:#2F5A86">HS</i><i style="background:var(--ink);color:#fff" id="plus"></i></div><span id="cPpl"></span></div>
      </div>
      <div class="card paid"><span class="sh"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span><div><b data-t="zero"></b><span id="cIns"></span></div></div>
      <div class="card"><div class="eyebrow" data-t="yourpath"></div><div class="tl"><i></i><i></i><i></i></div><div class="tll"><span data-t="today"></span><span data-t="week10"></span><span data-goal-short></span></div></div>
      <button class="btn dark" data-cal data-t="cal"></button>
      <button class="btn out" data-friend data-t="friend"></button>
      <button class="cta lime" id="openApp" style="margin-top:6px"><span data-t="openApp"></span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    </div>
  </section>

  <!-- Account (sign up / log in) -->
  <section class="screen sacc pad" id="sacc" hidden><div id="accBody" class="stack"></div></section>

  <!-- MAIN APP -->
  <section class="main" id="main" hidden>
    <div class="tabs">
      <div class="tab" id="tab-explore" hidden>
        <div class="tabhead pad"><div class="eyebrow" data-t="exploreEyebrow"></div><h2 class="t" data-t="explore"></h2></div>
        <div class="pad" style="padding-top:10px;padding-bottom:12px"><div class="chips" id="exChips"></div><div id="exInterests"></div></div>
        <div class="feed pad" id="feed"></div>
      </div>

      <div class="tab" id="tab-avatar" hidden>
        <div class="tabhead pad"><div class="eyebrow" data-t="youAt75"></div><h2 class="t" id="avTitle"></h2></div>
        <div id="geoBanner" class="pad" hidden style="padding-top:8px"></div>
        <div style="padding-top:12px"><div class="avstage" id="avStage" role="button" tabindex="0" aria-label="Avatar"></div></div>
        <div class="stack pad" style="padding-top:16px">
          <div class="card score"><div class="ring" id="ring"></div><div style="min-width:0"><span class="lvl" id="lvl"></span><div class="muted" id="lvlText" style="line-height:1.45"></div></div></div>
          <div class="card goalcard" id="goalCard"></div>
          <div class="card fitcard" id="fitCard"></div>
          <div class="card" id="ptsCard"></div>
          <div class="card"><div class="stats" id="stats"></div></div>
          <div class="card"><div class="eyebrow" style="margin-bottom:10px" data-t="todo"></div><div class="row2"><button class="btn lime small" id="checkin" data-t="checkin"></button><button class="btn out small" data-tab="map" data-t="findMore"></button></div><p class="hint" id="checkinMsg" style="margin-top:10px"></p></div>
          <div id="fbAvatar"></div>
          <details class="demo-box"><summary data-t="demoMode"></summary><p class="hint" style="margin:10px 0" data-t="demoModeD"></p><div class="row2"><button class="btn small dark" id="simGood" data-t="simGood"></button><button class="btn small out" id="simBad" data-t="simBad"></button><button class="btn small out" id="simReset" data-t="simReset"></button></div></details>
        </div>
      </div>

      <div class="tab" id="tab-map" hidden>
        <div class="mapwrap" id="mapB" style="height:330px"></div>
        <div class="sheet pad">
          <div class="grab"></div>
          <h2 class="t" data-count></h2>
          <p class="locmsg" data-locmsg></p>
          <div class="chips" data-chips></div>
          <div class="list" data-list></div>
        </div>
      </div>

      <div class="tab" id="tab-community" hidden>
        <div class="tabhead pad"><div class="eyebrow" data-t="communityEyebrow"></div><h2 class="t" data-t="community"></h2></div>
        <div class="stack pad" id="comView" hidden style="padding-top:12px;padding-bottom:28px"></div>
        <div class="stack pad" id="comHome" style="padding-top:12px">
          <div class="eyebrow" data-t="myGroupsT"></div>
          <div id="myGroups" class="stack" style="padding:0"></div>
          <div class="card" style="background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:10px">
            <b style="font-size:1.25rem" data-t="volT"></b><span style="opacity:.85;line-height:1.45" data-t="volD"></span>
            <button class="btn lime" id="volBtn"></button>
          </div>
          <div class="eyebrow" data-t="joinOthers"></div>
          <div id="comList" class="stack" style="padding:0"></div>
          <div class="eyebrow" data-t="startOwn"></div>
          <form class="card stack" id="newGroup" style="padding-bottom:20px" novalidate>
            <div class="field"><label for="ngName" data-t="ngName"></label><input id="ngName" maxlength="40"></div>
            <div class="two"><div class="field"><label for="ngType" data-t="ngType"></label><select id="ngType"></select></div><div class="field"><label for="ngDay" data-t="ngDay"></label><select id="ngDay"></select></div></div>
            <div class="two"><div class="field"><label for="ngTime" data-t="ngTime"></label><input id="ngTime" type="time" value="10:00"></div><div class="field"><label for="ngPlace" data-t="ngPlace"></label><input id="ngPlace" maxlength="40"></div></div>
            <p class="err" id="ngErr" hidden></p>
            <button class="btn dark" type="submit" data-t="ngCreate"></button>
          </form>
        </div>
      </div>

      <div class="tab" id="tab-settings" hidden>
        <div class="tabhead pad"><h2 class="t" data-t="settings"></h2></div>
        <div class="stack pad" style="padding-top:14px" id="settingsBody"></div>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-tab="explore"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span><span data-t="explore"></span></button>
      <button data-tab="avatar"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="5"/><path d="M4 21c1.5-3.8 4.5-5.5 8-5.5s6.5 1.7 8 5.5"/><path d="M10 9h.01M14 9h.01"/></svg></span><span data-t="avatar"></span></button>
      <button data-tab="map" class="mid"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><span data-t="map"></span></button>
      <button data-tab="community"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.8"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5M15 14.5c3 0 5.5 2 6.5 5.5"/></svg></span><span data-t="community"></span></button>
      <button data-tab="settings"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></span><span data-t="settings"></span></button>
    </nav>
  </section>

  <div class="scanov" id="scanOv" hidden><div class="scanbody pad" id="scanBody" role="dialog" aria-modal="true" aria-label="Face scan"></div></div>
  <div class="overlay" id="trSheet" hidden><div class="panel pad" role="dialog" aria-modal="true" aria-label="Connect tracker" id="trBody"></div></div>
  <div class="overlay" id="setSheet" hidden><div class="panel pad" role="dialog" aria-modal="true" aria-label="Settings" id="setSheetBody"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="js/i18n.js?v=8e00c29"></script>
<script src="js/icons.js?v=8e00c29"></script>
<script src="js/data.js?v=8e00c29"></script>
<script src="js/tracker.js?v=8e00c29"></script>
<script src="js/state.js?v=8e00c29"></script>
<script src="js/drawing.js?v=8e00c29"></script>
<script src="js/story/audio-manifest.js?v=8e00c29"></script>
<script src="js/story/helpers.js?v=8e00c29"></script>
<script src="js/story/lines.js?v=8e00c29"></script>
<script src="js/story/characters.js?v=8e00c29"></script>
<script src="js/story/props.js?v=8e00c29"></script>
<script src="js/story/backgrounds.js?v=8e00c29"></script>
<script src="js/story/camera.js?v=8e00c29"></script>
<script src="js/story/shots.js?v=8e00c29"></script>
<script src="js/story/audio.js?v=8e00c29"></script>
<script src="js/story/player.js?v=8e00c29"></script>
<script src="js/scan.js?v=8e00c29"></script>
<script src="js/score.js?v=8e00c29"></script>
<script src="js/points.js?v=8e00c29"></script>
<script src="js/avatar.js?v=8e00c29"></script>
<script src="js/feed.js?v=8e00c29"></script>
<script src="js/stories.js?v=8e00c29"></script>
<script src="js/geo.js?v=8e00c29"></script>
<script src="js/render.js?v=8e00c29"></script>
<script src="js/community.js?v=8e00c29"></script>
<script src="js/account.js?v=8e00c29"></script>
<script src="js/navigation.js?v=8e00c29"></script>
<script src="js/main.js?v=8e00c29"></script>
</body>
</html>
